<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Consulta de Produtos</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: #eef3f7; color: #17202a; }
      main { max-width: 1240px; margin: 0 auto; padding: 22px; }
      header { display: flex; gap: 18px; justify-content: space-between; align-items: end; border-bottom: 1px solid #d8dee8; padding-bottom: 18px; }
      h1 { margin: 0; font-size: 30px; }
      h2 { margin: 0; font-size: 16px; }
      input { width: 100%; height: 44px; border: 1px solid #d8dee8; border-radius: 6px; padding: 0 12px; font: inherit; }
      button { font: inherit; cursor: pointer; }
      .search { position: relative; width: min(720px, 100%); }
      .suggestions { position: absolute; z-index: 20; top: calc(100% + 8px); left: 0; right: 0; max-height: 320px; overflow-y: auto; background: white; border: 1px solid #d8dee8; border-radius: 6px; box-shadow: 0 14px 34px rgba(23, 32, 42, .14); }
      .suggestions:empty { display: none; }
      .suggestions button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid #d8dee8; background: white; padding: 12px 14px; }
      .suggestions button:last-child { border-bottom: 0; }
      .suggestions button:hover, .suggestions button:focus { background: #eef7f8; outline: none; }
      .suggestions small { display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #5f6b7a; }
      .eyebrow { color: #0e7c86; font-weight: 700; font-size: 13px; text-transform: uppercase; margin-bottom: 6px; }
      .grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; margin-top: 20px; }
      .panel { background: white; border: 1px solid #d8dee8; border-radius: 6px; overflow: hidden; }
      .panel-head { padding: 12px 14px; border-bottom: 1px solid #d8dee8; }
      .pad { padding: 14px; }
      .muted { color: #5f6b7a; }
      .results button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid #d8dee8; background: white; padding: 12px 14px; }
      .results button:hover, .results button.active { background: #0e7c86; color: white; }
      .results small { display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .8; }
      .content { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
      .product-title { font-size: 18px; font-weight: 700; }
      table { width: 100%; border-collapse: collapse; min-width: 760px; }
      th { background: #f7f9fc; color: #5f6b7a; text-align: left; text-transform: uppercase; font-size: 12px; }
      th, td { border-top: 1px solid #d8dee8; padding: 11px 12px; font-size: 14px; }
      .right { text-align: right; }
      .scroll { overflow-x: auto; }
      dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; background: #d8dee8; gap: 1px; }
      dt { color: #5f6b7a; font-size: 12px; font-weight: 700; text-transform: uppercase; }
      dd { margin: 4px 0 0; word-break: break-word; }
      .field { background: white; padding: 12px; }
      .pager { display: flex; align-items: center; gap: 10px; }
      .pager button { width: 36px; height: 36px; border: 1px solid #d8dee8; border-radius: 6px; background: white; }
      .pager button:disabled { opacity: .4; cursor: default; }
      @media (max-width: 860px) {
        header, .grid { display: block; }
        .search { margin-top: 14px; }
        aside { margin-bottom: 18px; }
        dl { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="eyebrow">Consulta ERP</div>
          <h1>Produtos, Estoque e Entradas</h1>
        </div>
        <div class="search">
          <input id="search" placeholder="Buscar por codigo ou descricao" autofocus autocomplete="off" />
          <div class="suggestions" id="suggestions"></div>
        </div>
      </header>
      <div class="grid">
        <aside>
          <div class="panel pad" style="margin-bottom: 14px;">
            <label for="filial"><strong>Filial</strong></label>
            <input id="filial" placeholder="Consolidar todas" style="margin-top: 8px;" />
          </div>
          <div class="panel results" id="results"><div class="pad muted">Digite parte do codigo ou descricao.</div></div>
        </aside>
        <section class="content" id="content">
          <div class="panel pad muted">Informe parte do codigo ou descricao do produto para iniciar a consulta.</div>
        </section>
      </div>
    </main>
    <script>
      const state = { term: "", selected: "", page: 1, products: [] };
      const fmtMoney = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
      const fmtNum = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const $ = (id) => document.getElementById(id);
      const money = (v) => Number.isFinite(Number(v)) ? fmtMoney.format(Number(v)) : "N/A";
      const num = (v) => Number.isFinite(Number(v)) ? fmtNum.format(Number(v)) : "N/A";
      const cost = (v) => v === null || v === undefined ? "N/A" : money(v);
      const date = (v) => v ? new Date(v).toLocaleDateString("pt-BR") : "N/A";
      const esc = (v) => String(v ?? "N/A").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));

      let timer;
      $("search").addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(search, 300);
      });
      $("search").addEventListener("focus", () => renderSuggestions());
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".search")) $("suggestions").innerHTML = "";
      });
      $("filial").addEventListener("input", () => {
        state.page = 1;
        if (state.selected) loadDetail();
      });

      async function api(path) {
        const res = await fetch(path);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }

      async function search() {
        state.term = $("search").value.trim();
        if (!state.term) {
          state.products = [];
          state.selected = "";
          $("results").innerHTML = '<div class="pad muted">Digite parte do codigo ou descricao.</div>';
          $("suggestions").innerHTML = "";
          $("content").innerHTML = '<div class="panel pad muted">Informe parte do codigo ou descricao do produto para iniciar a consulta.</div>';
          return;
        }
        $("results").innerHTML = '<div class="pad muted">Buscando produtos...</div>';
        $("suggestions").innerHTML = '<div class="pad muted">Buscando produtos...</div>';
        state.products = await api("/api/produtos/busca?q=" + encodeURIComponent(state.term));
        renderResults();
        renderSuggestions();
        if (state.products[0]) selectProduct(state.products[0].codigo);
      }

      function renderSuggestions() {
        if (!$("search").value.trim()) {
          $("suggestions").innerHTML = "";
          return;
        }
        if (!state.products.length) {
          $("suggestions").innerHTML = '<div class="pad muted">Nenhum item encontrado.</div>';
          return;
        }
        $("suggestions").innerHTML = state.products.slice(0, 8).map(p => `
          <button onclick="selectSuggestion('${esc(p.codigo)}')">
            <strong>${esc(p.codigo)}</strong>
            <small>${esc(p.descricao)}</small>
          </button>
        `).join("");
      }

      function renderResults() {
        if (!state.products.length) {
          $("results").innerHTML = '<div class="pad muted">Nenhum resultado.</div>';
          return;
        }
        $("results").innerHTML = state.products.map(p => `
          <button class="${p.codigo === state.selected ? "active" : ""}" onclick="selectProduct('${esc(p.codigo)}')">
            <strong>${esc(p.codigo)}</strong>
            <small>${esc(p.descricao)}</small>
          </button>
        `).join("");
      }

      window.selectProduct = (code) => {
        state.selected = code;
        state.page = 1;
        renderResults();
        loadDetail();
      };

      window.selectSuggestion = (code) => {
        $("suggestions").innerHTML = "";
        selectProduct(code);
      };

      async function loadDetail() {
        const filial = $("filial").value.trim();
        const params = new URLSearchParams({ page: String(state.page), pageSize: "20" });
        if (filial) params.set("filial", filial);
        $("content").innerHTML = '<div class="panel pad muted">Carregando detalhes...</div>';
        const data = await api("/api/produtos/" + encodeURIComponent(state.selected) + "?" + params.toString());
        renderDetail(data);
      }

      function renderDetail(data) {
        $("content").innerHTML = `
          <div class="panel pad">
            <div class="muted"><strong>${esc(data.sb1.b1_cod)}</strong></div>
            <div class="product-title">${esc(data.sb1.b1_desc)}</div>
          </div>
          ${stockPanel(data.sb2)}
          ${productPanel(data.sb1)}
          ${invoicePanel(data.sd1)}
        `;
      }

      function stockPanel(sb2) {
        return `
          <div class="panel">
            <div class="panel-head"><h2>Estoque e Valor</h2></div>
            <div class="scroll"><table>
              <thead><tr><th>Filial</th><th>Armazem</th><th class="right">Quantidade</th><th class="right">Custo total</th><th class="right">Custo unitario</th></tr></thead>
              <tbody>${sb2.rows.map(r => `<tr><td>${esc(r.b2_filial)}</td><td>${esc(r.b2_local)}</td><td class="right">${num(r.b2_qatu)}</td><td class="right">${money(r.b2_cm1)}</td><td class="right">${cost(r.custo_unitario)}</td></tr>`).join("")}</tbody>
              <tfoot><tr><th colspan="2">Total consolidado</th><th class="right">${num(sb2.total.quantidade)}</th><th class="right">${money(sb2.total.custo_total)}</th><th class="right">${cost(sb2.total.custo_unitario)}</th></tr></tfoot>
            </table></div>
          </div>`;
      }

      function productPanel(sb1) {
        const skip = new Set(["id", "d_e_l_e_t_"]);
        return `
          <div class="panel">
            <div class="panel-head"><h2>Cadastro do Produto</h2></div>
            <dl>${Object.entries(sb1).filter(([k]) => !skip.has(k)).map(([k, v]) => `<div class="field"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
          </div>`;
      }

      function invoicePanel(sd1) {
        return `
          <div class="panel">
            <div class="panel-head" style="display:flex;justify-content:space-between;gap:12px;align-items:center;">
              <h2>Notas Fiscais de Entrada</h2>
              <div class="pager">
                <button ${sd1.pagination.page <= 1 ? "disabled" : ""} onclick="changePage(${sd1.pagination.page - 1})">&lt;</button>
                <span>${sd1.pagination.page} / ${Math.max(sd1.pagination.totalPages, 1)} (${sd1.pagination.total})</span>
                <button ${sd1.pagination.page >= sd1.pagination.totalPages ? "disabled" : ""} onclick="changePage(${sd1.pagination.page + 1})">&gt;</button>
              </div>
            </div>
            <div class="scroll"><table>
              <thead><tr><th>NF</th><th>Serie</th><th>Emissao</th><th>Entrada</th><th>Fornecedor</th><th>CNPJ</th><th class="right">Qtd.</th><th class="right">Vlr. unit.</th><th class="right">Vlr. total</th><th class="right">Custo calc.</th></tr></thead>
              <tbody>${sd1.rows.map(r => `<tr><td>${esc(r.d1_doc)}</td><td>${esc(r.d1_serie)}</td><td>${date(r.d1_emissao)}</td><td>${date(r.d1_dtdigit)}</td><td><strong>${esc(r.fornecedor.codigo)} / ${esc(r.fornecedor.loja)}</strong><br><span class="muted">${esc(r.fornecedor.nome)}</span></td><td>${esc(r.fornecedor.cnpj)}</td><td class="right">${num(r.d1_quant)}</td><td class="right">${money(r.d1_vunit)}</td><td class="right">${money(r.d1_total)}</td><td class="right">${cost(r.custo_unitario)}</td></tr>`).join("")}</tbody>
            </table></div>
          </div>`;
      }

      window.changePage = (page) => {
        state.page = page;
        loadDetail();
      };
    </script>
  </body>
</html>
