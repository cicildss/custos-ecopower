services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: protheus
      POSTGRES_PASSWORD: protheus
      POSTGRES_DB: consulta_produtos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/migrations/001_init/migration.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protheus -d consulta_produtos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run prisma:generate && npm run seed && npm run dev"
    environment:
      DATABASE_URL: postgresql://protheus:protheus@postgres:5432/consulta_produtos?schema=public
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  postgres_data:
